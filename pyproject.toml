[project]
name = "discord-server-os"
version = "1.0.0"
description = "A Discord Server OS bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["bot"]
